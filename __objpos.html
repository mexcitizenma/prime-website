<!doctype html><meta charset="utf-8">
<body style="margin:0;background:#fff;font:14px system-ui">
<script>
var tests = [
  ['handyman','images/stock/web/handyman.jpg',['center 20%','center 30%','center 43%','center 55%','center 65%']],
  ['pressure-washing','images/stock/web/pressure-washing.jpg',['center 55%','center 69%','center 80%']],
  ['epoxy','images/stock/web/epoxy-floors.jpg',['center 55%','center 70%','center 85%']]
];
var h='';
tests.forEach(function(t){
  t[2].forEach(function(pos){
    h += '<div style="padding:4px 20px;font-weight:600">'+t[0]+' — '+pos+'</div>'
      + '<img src="'+t[1]+'" style="display:block;width:1078px;height:300px;object-fit:cover;object-position:'+pos+';margin:0 20px 14px">';
  });
});
document.body.innerHTML = h;
</script>
</body>
