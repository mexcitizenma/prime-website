<!doctype html><meta charset="utf-8">
<body style="margin:0">
<script>
var WIDTHS = [320, 360, 375, 414, 480, 600, 768, 820, 1024, 1280, 1440, 1920];
var PAGES = ['/__shot.html', '/es/__shot_es.html'];
var out = [], pending = 0;
function measure(fr, w, page) {
  var d = fr.contentDocument, rows = [];
  d.querySelectorAll('.service-block').forEach(function (b) {
    var img = b.querySelector('.service-block__photo');
    if (!img) return;
    var r = img.getBoundingClientRect();
    rows.push('    ' + b.id.padEnd(20) + Math.round(r.width) + 'x' + Math.round(r.height)
      + '  ratio ' + (r.width / r.height).toFixed(2)
      + '  nat ' + img.naturalWidth + 'x' + img.naturalHeight);
  });
  var vw = fr.contentDocument.documentElement.clientWidth;
  var sw = fr.contentDocument.documentElement.scrollWidth;
  var uniq = {}; rows.forEach(function(r){ uniq[r.split('  ')[0].split(/\s+/).slice(1).join(' ')] = 1; });
  out.push('== ' + page + ' @ ' + w + 'px (vw ' + vw + ', scrollW ' + sw
    + (sw > vw + 1 ? ' *** H-OVERFLOW ***' : ' no-overflow') + ', photos ' + rows.length
    + ', distinct sizes ' + Object.keys(uniq).length + ')');
  out.push(rows.join('\n'));
}
PAGES.forEach(function (page) {
  WIDTHS.forEach(function (w) {
    pending++;
    var fr = document.createElement('iframe');
    fr.style.cssText = 'width:' + w + 'px;height:600px;border:0;display:block';
    fr.onload = function () {
      setTimeout(function () {
        try { measure(fr, w, page); } catch (e) { out.push('ERR ' + page + ' ' + w + ': ' + e); }
        if (--pending === 0) { document.body.innerHTML = '<pre id="out">' + out.join('\n') + '</pre>'; }
      }, 400);
    };
    fr.src = page;
    document.body.appendChild(fr);
  });
});
</script>
</body>
